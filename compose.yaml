services:
  nexaflow:
    build:
      context: .
    ports:
      - "127.0.0.1:4318:4318"
    environment:
      NEXAFLOW_HOST: "0.0.0.0"
      NEXAFLOW_PORT: "4318"
      NEXAFLOW_SYNC_TOKEN: ${NEXAFLOW_SYNC_TOKEN:?Set NEXAFLOW_SYNC_TOKEN in your environment or .env file}
      NEXAFLOW_TRUSTED_LOCAL_ORIGIN: "http://127.0.0.1:4318"
      NEXAFLOW_AI_API_KEY: ${NEXAFLOW_AI_API_KEY:-}
      NEXAFLOW_AI_BASE_URL: ${NEXAFLOW_AI_BASE_URL:-}
      NEXAFLOW_AI_MODEL: ${NEXAFLOW_AI_MODEL:-}
    volumes:
      - nexaflow-data:/app/data
    restart: unless-stopped

volumes:
  nexaflow-data:
